name: Swift Apple platforms
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4.1'
      - name: Test and compile Apple platforms
        run: ./Scripts/validate-apple.sh
